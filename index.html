<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e9eadb" />
  <title>风栖小镇 · Yua World</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
  <main id="world" aria-label="三维乡间小镇"></main>
  <div id="look-zone" aria-label="拖动调整视角"></div>
  <aside class="climate-panel" aria-label="四季与天气">
    <div class="weather" aria-live="polite"><span id="weather-icon">☀</span><span id="weather-label">夏日晴朗</span><span id="temperature">28°C</span></div>
    <div class="season-options" role="group" aria-label="季节">
      <button type="button" data-season="spring" aria-pressed="false">春</button>
      <button type="button" data-season="summer" aria-pressed="true">夏</button>
      <button type="button" data-season="autumn" aria-pressed="false">秋</button>
      <button type="button" data-season="winter" aria-pressed="false">冬</button>
    </div>
    <div class="weather-options" role="group" aria-label="天气">
      <button type="button" data-weather="clear" aria-label="晴天" aria-pressed="true">☀</button>
      <button type="button" data-weather="rain" aria-label="雨天" aria-pressed="false">☂</button>
      <button type="button" data-weather="snow" aria-label="雪天" aria-pressed="false">❄</button>
    </div>
  </aside>
  <button id="minimap" type="button" aria-label="打开完整地图" aria-haspopup="dialog"><canvas id="minimap-canvas" aria-label="人物位置与朝向"></canvas><span class="map-expand" aria-hidden="true">↗</span></button>
  <dialog id="world-map" aria-labelledby="map-title">
    <div class="map-header"><span id="map-title">风栖小镇</span><button id="map-close" type="button" aria-label="关闭地图">×</button></div>
    <canvas id="full-map-canvas" aria-label="完整小镇地图，显示人物、我的家、道路与主要建筑"></canvas>
    <div class="map-legend"><span><i class="player-dot"></i>当前位置</span><span><i class="home-dot"></i>我的家</span></div>
  </dialog>
  <div id="joystick" role="group" aria-label="左手移动摇杆"><div class="joystick-ring"></div><div id="joystick-knob"></div></div>
  <div class="look-indicator" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 16s4-7 11-7 11 7 11 7-4 7-11 7S5 16 5 16Z"/><circle cx="16" cy="16" r="3"/></svg></div>
  <div id="loading" role="status" aria-label="正在加载"><span></span></div>
  <script type="module" src="./src/main.js"></script>
  <script>window.setTimeout(() => { const el = document.getElementById('loading'); if (el && !el.hidden) { el.dataset.error = 'true'; el.setAttribute('aria-label', '加载较慢，请检查网络后刷新'); } }, 15000);</script>
</body>
</html>
